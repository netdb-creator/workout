<html lang="ja"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="筋トレログ">
<title>筋トレログ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');

:root {
  --bg: #0d0d0d;
  --surface: #161616;
  --surface2: #202020;
  --surface3: #2a2a2a;
  --border: #303030;
  --accent: #e8ff00;
  --accent2: #00ffa3;
  --accent-dim: #9aaa00;
  --text: #f0f0f0;
  --text-sub: #999;
  --text-muted: #555;
  --danger: #ff3b3b;
  --r: 10px;
  --nav-h: 64px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
  display: flex;
  flex-direction: column;
}

.app-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  height: 52px;
}

.app-title {
  font-family: 'Space Mono', monospace;
  font-size: 16px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 3px;
}

.sync-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--text-muted);
  transition: background 0.3s;
}
.sync-dot.ok { background: var(--accent2); box-shadow: 0 0 6px var(--accent2); }
.sync-dot.err { background: var(--danger); }

.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: var(--nav-h);
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 200;
  padding-bottom: env(safe-area-inset-bottom);
}

.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 10px;
  font-weight: 500;
  transition: color 0.2s;
  padding: 8px 0;
}
.nav-item.active { color: var(--accent); }
.nav-icon { font-size: 22px; line-height: 1; }

.pages { flex: 1; overflow: hidden; position: relative; }

.page {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px 16px calc(var(--nav-h) + 16px);
  display: none;
}
.page.active { display: block; }

/* ===== 記録 ===== */
.date-selector {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 10px 14px;
}
.date-selector input[type="date"] {
  flex: 1;
  background: none;
  border: none;
  color: var(--text);
  font-family: 'Space Mono', monospace;
  font-size: 15px;
  outline: none;
}
.date-label { font-size: 11px; color: var(--text-muted); white-space: nowrap; }

.exercise-block {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 12px;
  overflow: hidden;
}
.exercise-block-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
}
.ex-name-input {
  flex: 1;
  background: none;
  border: none;
  color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 14px;
  font-weight: 700;
  outline: none;
}
.ex-name-input::placeholder { color: var(--text-muted); font-weight: 400; }

.btn-icon {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px 6px;
  font-size: 18px;
  line-height: 1;
  border-radius: 6px;
}
.btn-icon:active { background: var(--surface3); }

.set-row {
  display: grid;
  grid-template-columns: 28px 1fr 1fr 1fr 28px;
  gap: 6px;
  align-items: center;
  padding: 8px 14px;
  border-bottom: 1px solid var(--border);
}
.set-num {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: var(--accent);
  text-align: center;
}
.set-input-wrap { display: flex; flex-direction: column; gap: 2px; }
.set-input-label { font-size: 9px; color: var(--text-muted); text-align: center; }
.set-input {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: 'Space Mono', monospace;
  font-size: 15px;
  text-align: center;
  padding: 7px 4px;
  width: 100%;
  outline: none;
}
.set-input:focus { border-color: var(--accent); }
.set-select {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 13px;
  padding: 7px 4px;
  width: 100%;
  outline: none;
  text-align: center;
}
.set-memo-row { padding: 0 14px 10px; }
.set-memo-input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-sub);
  font-size: 12px;
  font-family: 'Noto Sans JP', sans-serif;
  padding: 6px 10px;
  outline: none;
}
.set-memo-input:focus { border-color: var(--accent2); color: var(--text); }
.set-memo-input::placeholder { color: var(--text-muted); }

.exercise-footer { padding: 8px 14px 12px; }
.btn-add-set {
  width: 100%;
  background: var(--surface2);
  border: 1px dashed var(--border);
  color: var(--text-sub);
  border-radius: 8px;
  padding: 9px;
  font-size: 13px;
  cursor: pointer;
}
.btn-add-set:active { background: var(--surface3); }

.add-exercise-btn {
  width: 100%;
  background: var(--surface);
  border: 1px dashed var(--border);
  color: var(--text-sub);
  border-radius: var(--r);
  padding: 14px;
  font-size: 14px;
  cursor: pointer;
  margin-bottom: 10px;
}
.save-btn {
  width: 100%;
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: var(--r);
  padding: 16px;
  font-size: 16px;
  font-weight: 700;
  font-family: 'Space Mono', monospace;
  letter-spacing: 2px;
  cursor: pointer;
  transition: opacity 0.2s;
}
.save-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.save-btn:active:not(:disabled) { opacity: 0.8; }

/* ===== 履歴 ===== */
.view-toggle {
  display: flex;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 4px;
  margin-bottom: 16px;
  gap: 4px;
}
.view-toggle-btn {
  flex: 1;
  padding: 9px;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  background: none;
  color: var(--text-muted);
  transition: all 0.2s;
}
.view-toggle-btn.active {
  background: var(--accent);
  color: #000;
  font-weight: 700;
}

/* ===== カレンダー ===== */
.calendar-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.cal-month {
  font-family: 'Space Mono', monospace;
  font-size: 15px;
  color: var(--text);
}
.cal-nav-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  width: 36px; height: 36px;
  border-radius: 8px;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* カレンダー凡例 */
.cal-legend {
  display: flex;
  gap: 14px;
  margin-bottom: 12px;
  padding: 8px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text-sub);
}
.legend-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.legend-dot.trained { background: var(--accent); }
.legend-dot.rest { background: var(--surface3); border: 1px solid var(--border); }
.legend-dot.today-dot { background: transparent; border: 2px solid var(--accent2); }

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-bottom: 14px;
}
.cal-dow {
  text-align: center;
  font-size: 10px;
  color: var(--text-muted);
  padding: 4px 0;
  font-family: 'Space Mono', monospace;
}

/* 日付セル */
.cal-day {
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  font-size: 13px;
  position: relative;
  transition: all 0.15s;
  border: 1px solid transparent;
  color: var(--text-muted);
  background: var(--surface2);
  font-family: 'Space Mono', monospace;
}

.cal-day.empty {
  background: none;
  border-color: transparent;
  cursor: default;
}

/* 休養日（記録なし・過去） */
.cal-day.rest-day {
  background: var(--surface);
  color: var(--text-muted);
  border-color: var(--border);
}

/* トレーニング日 */
.cal-day.trained {
  background: rgba(232, 255, 0, 0.12);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 700;
  cursor: pointer;
}

/* 今日 */
.cal-day.today {
  border-color: var(--accent2);
  color: var(--accent2);
}
.cal-day.today.trained {
  background: rgba(232, 255, 0, 0.15);
  border-color: var(--accent);
  color: var(--accent);
}

/* 選択中 */
.cal-day.selected {
  background: var(--accent) !important;
  color: #000 !important;
  border-color: var(--accent) !important;
}

.cal-day.trained:active { opacity: 0.7; }

/* トレーニング日の小さいドット */
.cal-day.trained::after {
  content: '';
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--accent2);
  position: absolute;
  bottom: 3px;
}
.cal-day.selected::after { background: #000; }

/* 未来の日 */
.cal-day.future {
  background: none;
  border-color: transparent;
  color: var(--text-muted);
  opacity: 0.3;
  cursor: default;
}

/* カレンダー詳細 */
.cal-detail {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
}

.cal-detail-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
}

.cal-detail-date {
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  color: var(--accent);
}

.cal-detail-link {
  font-size: 12px;
  color: var(--accent2);
  cursor: pointer;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border: 1px solid var(--accent2);
  border-radius: 6px;
  transition: all 0.15s;
}
.cal-detail-link:active { background: rgba(0,255,163,0.1); }

.cal-detail-body { padding: 12px 14px; }
.cal-detail-empty {
  color: var(--text-muted);
  font-size: 13px;
  text-align: center;
  padding: 20px 0;
}
.cal-placeholder {
  color: var(--text-muted);
  font-size: 13px;
  text-align: center;
  padding: 24px 0;
}

/* ===== 履歴リスト ===== */
.history-day {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 10px;
  overflow: hidden;
  scroll-margin-top: 16px;
}
.history-day.highlight {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}
.history-day-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  cursor: pointer;
  background: var(--surface2);
  transition: background 0.15s;
}
.history-day-header:active { background: var(--surface3); }
.history-day-date {
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  color: var(--accent);
}
.history-day-meta {
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  gap: 8px;
  align-items: center;
}
.history-body { padding: 12px 14px; display: none; }
.history-body.open { display: block; }

.history-ex { margin-bottom: 12px; }
.history-ex:last-of-type { margin-bottom: 0; }
.history-ex-name {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
}
.history-sets { display: flex; flex-wrap: wrap; gap: 5px; }
.set-chip {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 4px 8px;
  color: var(--text-sub);
}
.set-chip.memo-chip { border-color: var(--accent2); }
.history-memo-text {
  font-size: 11px;
  color: var(--text-sub);
  margin-top: 5px;
  padding: 5px 8px;
  background: var(--surface2);
  border-radius: 5px;
  border-left: 2px solid var(--accent2);
}
.history-del-btn {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.btn-sm-danger {
  background: none;
  border: 1px solid var(--danger);
  color: var(--danger);
  border-radius: 6px;
  padding: 5px 12px;
  font-size: 12px;
  cursor: pointer;
}
.chevron {
  font-size: 12px;
  transition: transform 0.2s;
  color: var(--text-muted);
}
.chevron.open { transform: rotate(90deg); }

/* ===== 種目管理 ===== */
.ex-manage-search {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  color: var(--text);
  font-size: 14px;
  font-family: 'Noto Sans JP', sans-serif;
  padding: 12px 14px;
  outline: none;
  margin-bottom: 16px;
}
.ex-manage-search:focus { border-color: var(--accent); }

.add-ex-row {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}
.add-ex-input {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  color: var(--text);
  font-size: 14px;
  font-family: 'Noto Sans JP', sans-serif;
  padding: 12px 14px;
  outline: none;
  min-width: 0;
}
.add-ex-input:focus { border-color: var(--accent); }
.add-ex-select {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  color: var(--text);
  font-size: 13px;
  padding: 12px 8px;
  outline: none;
  width: 64px;
  flex-shrink: 0;
}
.add-ex-btn {
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: var(--r);
  padding: 12px 14px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
}
.category-section { margin-bottom: 20px; }
.category-label {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--accent);
  letter-spacing: 2px;
  padding: 0 4px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.category-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}
.ex-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 6px;
}
.ex-item-name { font-size: 14px; }
.ex-item-del {
  background: none;
  border: 1px solid var(--danger);
  color: var(--danger);
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 12px;
  cursor: pointer;
  flex-shrink: 0;
}
.ex-item-del:disabled {
  color: var(--text-muted);
  border-color: var(--border);
  cursor: default;
}

/* ===== 共通 ===== */
.section-title {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 2px;
  margin-bottom: 12px;
}
.empty-msg {
  text-align: center;
  padding: 32px 20px;
  color: var(--text-muted);
  font-size: 13px;
}
.toast {
  position: fixed;
  bottom: calc(var(--nav-h) + 12px);
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--surface3);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 10px 18px;
  border-radius: 20px;
  font-size: 13px;
  opacity: 0;
  transition: all 0.25s;
  z-index: 999;
  white-space: nowrap;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.ok { border-color: var(--accent2); color: var(--accent2); }
.toast.ng { border-color: var(--danger); color: var(--danger); }

input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { display: none; }
</style>

<body>

<header class="app-header">
  <span class="app-title">WORKOUT</span>
  <div class="sync-dot ok" id="syncDot"></div>
</header>

<div class="pages">
  <!-- 記録 -->
  <div class="page active" id="pg-record">
    <div class="date-selector">
      <span class="date-label">DATE</span>
      <input type="date" id="workoutDate">
    </div>
    <div id="exerciseList">
    <div class="exercise-block">
      <div class="exercise-block-header">
        <input class="ex-name-input" list="el-0" placeholder="種目名を入力または選択" value="" oninput="EX.name(0,this.value)">
        <datalist id="el-0"><option value="インクラインダンベルプレス"></option><option value="ダンベルフライ"></option><option value="ベンチプレス"></option><option value="ダンベルプレス"></option><option value="ペックデック"></option><option value="ケーブルクロスオーバー"></option><option value="インクラインベンチプレス"></option><option value="ラットプルダウン"></option><option value="シーテッドロー"></option><option value="デッドリフト"></option><option value="チンアップ"></option><option value="ダンベルロウ"></option><option value="ケーブルロー"></option><option value="バーベルロウ"></option><option value="スクワット"></option><option value="レッグプレス"></option><option value="レッグカール"></option><option value="レッグエクステンション"></option><option value="ランジ"></option><option value="ルーマニアンデッドリフト"></option><option value="カーフレイズ"></option><option value="ショルダープレス"></option><option value="サイドレイズ"></option><option value="フロントレイズ"></option><option value="リアレイズ"></option><option value="アーノルドプレス"></option><option value="ダンベルカール"></option><option value="バーベルカール"></option><option value="ハンマーカール"></option><option value="インクラインカール"></option><option value="コンセントレーションカール"></option><option value="ダンベルフレンチプレス"></option><option value="トライセプスプッシュダウン"></option><option value="スカルクラッシャー"></option><option value="ディップス"></option><option value="オーバーヘッドトライセプスエクステンション"></option><option value="アブドミナル"></option><option value="クランチ"></option><option value="レッグレイズ"></option><option value="プランク"></option><option value="ロシアンツイスト"></option><option value="フェイスプル"></option><option value="シュラッグ"></option><option value="ヒップスラスト"></option></datalist>
        <button class="btn-icon" onclick="EX.rmEx(0)">✕</button>
      </div>
      
        <div class="set-row">
          <span class="set-num">1</span>
          <div class="set-input-wrap">
            <span class="set-input-label">重量</span>
            <input class="set-input" type="number" inputmode="decimal" step="0.5" value="" placeholder="0" oninput="EX.set(0,0,&#39;weight&#39;,this.value)">
          </div>
          <div class="set-input-wrap">
            <span class="set-input-label">回数</span>
            <input class="set-input" type="number" inputmode="numeric" value="10" placeholder="10" oninput="EX.set(0,0,&#39;reps&#39;,this.value)">
          </div>
          <div class="set-input-wrap">
            <span class="set-input-label">単位</span>
            <select class="set-select" onchange="EX.set(0,0,&#39;unit&#39;,this.value)">
              <option value="kg" selected="">kg</option>
              <option value="lb">lb</option>
            </select>
          </div>
          <button class="btn-icon" style="font-size:16px;" onclick="EX.rmSet(0,0)">−</button>
        </div>
        <div class="set-memo-row">

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs,
  deleteDoc, doc, query, orderBy
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDN7LSAFa5DP91Jj6Yaom9vw-PWz99fI-Y",
  authDomain: "workout-log-4a232.firebaseapp.com",
  projectId: "workout-log-4a232",
  storageBucket: "workout-log-4a232.firebasestorage.app",
  messagingSenderId: "643275653740",
  appId: "1:643275653740:web:5b3a911534f5c90c628e49"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const COL = "workout_logs";

// ===== 種目データ =====
const CATEGORIES = ['胸','背中','脚','肩','二頭','三頭','腹','その他'];
const DEFAULT_EX = {
  '胸': ['インクラインダンベルプレス','ダンベルフライ','ベンチプレス','ダンベルプレス','ペックデック','ケーブルクロスオーバー','インクラインベンチプレス'],
  '背中': ['ラットプルダウン','シーテッドロー','デッドリフト','チンアップ','ダンベルロウ','ケーブルロー','バーベルロウ'],
  '脚': ['スクワット','レッグプレス','レッグカール','レッグエクステンション','ランジ','ルーマニアンデッドリフト','カーフレイズ'],
  '肩': ['ショルダープレス','サイドレイズ','フロントレイズ','リアレイズ','アーノルドプレス'],
  '二頭': ['ダンベルカール','バーベルカール','ハンマーカール','インクラインカール','コンセントレーションカール'],
  '三頭': ['ダンベルフレンチプレス','トライセプスプッシュダウン','スカルクラッシャー','ディップス','オーバーヘッドトライセプスエクステンション'],
  '腹': ['アブドミナル','クランチ','レッグレイズ','プランク','ロシアンツイスト'],
  'その他': ['フェイスプル','シュラッグ','ヒップスラスト'],
};

function getCustomEx() {
  return JSON.parse(localStorage.getItem('custom_ex_v2') || '[]');
}
function saveCustomEx(arr) {
  localStorage.setItem('custom_ex_v2', JSON.stringify(arr));
}
function getAllExByCategory() {
  const custom = getCustomEx();
  const result = {};
  CATEGORIES.forEach(cat => { result[cat] = [...(DEFAULT_EX[cat] || [])]; });
  custom.forEach(({name, category}) => {
    const cat = CATEGORIES.includes(category) ? category : 'その他';
    if (!result[cat]) result[cat] = [];
    if (!result[cat].includes(name)) result[cat].push(name);
  });
  return result;
}
function getAllExNames() {
  return CATEGORIES.flatMap(c => getAllExByCategory()[c] || []);
}

// ===== グローバル状態 =====
let exercises = [];
let historyLogs = [];
let calYear, calMonth;
let selectedCalDate = null;
let currentView = 'calendar';

const WD = ['日','月','火','水','木','金','土'];

function toDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// ===== ページ切替 =====
window.switchPage = function(page) {
  ['record','history','exercises'].forEach(p => {
    document.getElementById(`pg-${p}`).classList.toggle('active', p===page);
    document.getElementById(`nav-${p}`).classList.toggle('active', p===page);
  });
  if (page==='history') {
    loadHistory().then(() => {
      if (currentView==='calendar') renderCalendar();
      else renderHistoryList();
    });
  }
  if (page==='exercises') renderExerciseList();
};

// ===== 記録ページ =====
function initRecord() {
  document.getElementById('workoutDate').value = toDateStr(new Date());
  exercises = [];
  addExercise();
}

window.addExercise = function() {
  exercises.push({ name:'', sets:[{weight:'',reps:10,unit:'kg',memo:''}] });
  renderRecord();
};

window.EX = {
  name: (ei,v) => { exercises[ei].name = v; },
  set: (ei,si,f,v) => { exercises[ei].sets[si][f] = v; },
  rmEx: (ei) => { exercises.splice(ei,1); if(!exercises.length) window.addExercise(); else renderRecord(); },
  rmSet: (ei,si) => { if(exercises[ei].sets.length>1){ exercises[ei].sets.splice(si,1); renderRecord(); } },
  addSet: (ei) => {
    const p = exercises[ei].sets[exercises[ei].sets.length-1];
    exercises[ei].sets.push({weight:p.weight,reps:p.reps,unit:p.unit||'kg',memo:''});
    renderRecord();
  }
};

function renderRecord() {
  const names = getAllExNames();
  document.getElementById('exerciseList').innerHTML = exercises.map((ex,ei) => `
    <div class="exercise-block">
      <div class="exercise-block-header">
        <input class="ex-name-input" list="el-${ei}" placeholder="種目名を入力または選択"
          value="${ex.name}" oninput="EX.name(${ei},this.value)">
        <datalist id="el-${ei}">${names.map(n=>`<option value="${n}">`).join('')}</datalist>
        <button class="btn-icon" onclick="EX.rmEx(${ei})">✕</button>
      </div>
      ${ex.sets.map((s,si) => `
        <div class="set-row">
          <span class="set-num">${si+1}</span>
          <div class="set-input-wrap">
            <span class="set-input-label">重量</span>
            <input class="set-input" type="number" inputmode="decimal" step="0.5"
              value="${s.weight}" placeholder="0" oninput="EX.set(${ei},${si},'weight',this.value)">
          </div>
          <div class="set-input-wrap">
            <span class="set-input-label">回数</span>
            <input class="set-input" type="number" inputmode="numeric"
              value="${s.reps}" placeholder="10" oninput="EX.set(${ei},${si},'reps',this.value)">
          </div>
          <div class="set-input-wrap">
            <span class="set-input-label">単位</span>
            <select class="set-select" onchange="EX.set(${ei},${si},'unit',this.value)">
              <option value="kg" ${s.unit!=='lb'?'selected':''}>kg</option>
              <option value="lb" ${s.unit==='lb'?'selected':''}>lb</option>
            </select>
          </div>
          <button class="btn-icon" style="font-size:16px;" onclick="EX.rmSet(${ei},${si})">−</button>
        </div>
        <div class="set-memo-row">
          <input class="set-memo-input" type="text" placeholder="メモ（任意）"
            value="${s.memo}" oninput="EX.set(${ei},${si},'memo',this.value)">
        </div>
      `).join('')}
      <div class="exercise-footer">
        <button class="btn-add-set" onclick="EX.addSet(${ei})">＋ セット追加</button>
      </div>
    </div>
  `).join('');
}

window.saveWorkout = async function() {
  const date = document.getElementById('workoutDate').value;
  if (!date) { showToast('日付を選択してください','ng'); return; }
  const valid = exercises.filter(ex => ex.name.trim());
  if (!valid.length) { showToast('種目名を入力してください','ng'); return; }

  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'SAVING...';
  try {
    await addDoc(collection(db, COL), {
      date, createdAt: new Date().toISOString(),
      exercises: valid.map(ex => ({
        name: ex.name.trim(),
        sets: ex.sets.map(s => ({
          weight: parseFloat(s.weight)||0,
          reps: parseInt(s.reps)||0,
          unit: s.unit||'kg',
          memo: s.memo||''
        }))
      }))
    });
    historyLogs = [];
    showToast('保存しました','ok');
    setSyncStatus('ok');
    exercises = [];
    window.addExercise();
  } catch(e) {
    console.error(e);
    showToast('保存に失敗しました','ng');
    setSyncStatus('err');
  } finally {
    btn.disabled = false; btn.textContent = 'SAVE';
  }
};

// ===== 履歴読み込み =====
async function loadHistory() {
  if (historyLogs.length > 0) return;
  try {
    const snap = await getDocs(query(collection(db, COL), orderBy('date','desc')));
    historyLogs = [];
    snap.forEach(d => historyLogs.push({id:d.id,...d.data()}));
    setSyncStatus('ok');
  } catch(e) { setSyncStatus('err'); }
}

// ===== ビュー切替 =====
window.setView = function(v) {
  currentView = v;
  document.getElementById('btn-calendar').classList.toggle('active', v==='calendar');
  document.getElementById('btn-list').classList.toggle('active', v==='list');
  document.getElementById('calendar-view').style.display = v==='calendar' ? '' : 'none';
  document.getElementById('list-view').style.display = v==='list' ? '' : 'none';
  if (v==='calendar') renderCalendar();
  else renderHistoryList();
};

// ===== カレンダー =====
function renderCalendar() {
  const logDates = new Set(historyLogs.map(l => l.date));
  const today = new Date();
  const todayStr = toDateStr(today);
  if (!calYear) { calYear = today.getFullYear(); calMonth = today.getMonth(); }

  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();

  const cells = [];
  for (let i=0; i<firstDay; i++) cells.push('<div class="cal-day empty"></div>');

  for (let d=1; d<=daysInMonth; d++) {
    const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isTrained = logDates.has(ds);
    const isToday = ds === todayStr;
    const isSelected = ds === selectedCalDate;
    const isFuture = ds > todayStr;

    let cls = 'cal-day';
    if (isFuture) cls += ' future';
    else if (isTrained) cls += ' trained';
    else if (!isToday) cls += ' rest-day';
    if (isToday) cls += ' today';
    if (isSelected) cls += ' selected';

    const click = isTrained ? `onclick="selectCalDay('${ds}')"` : '';
    cells.push(`<div class="${cls}" ${click}>${d}</div>`);
  }

  const monthStr = `${calYear}年${calMonth+1}月`;

  document.getElementById('calendar-view').innerHTML = `
    <div class="calendar-nav">
      <button class="cal-nav-btn" onclick="moveMonth(-1)">‹</button>
      <span class="cal-month">${monthStr}</span>
      <button class="cal-nav-btn" onclick="moveMonth(1)">›</button>
    </div>
    <div class="cal-legend">
      <div class="legend-item"><div class="legend-dot trained"></div>トレーニング</div>
      <div class="legend-item"><div class="legend-dot rest"></div>休養</div>
      <div class="legend-item"><div class="legend-dot today-dot"></div>今日</div>
    </div>
    <div class="cal-grid">
      ${WD.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells.join('')}
    </div>
    <div class="cal-detail" id="calDetail">
      ${selectedCalDate ? renderCalDetailContent(selectedCalDate) : '<div class="cal-placeholder">トレーニングした日付をタップ</div>'}
    </div>
  `;
}

function renderCalDetailContent(date) {
  const logs = historyLogs.filter(l => l.date === date);
  if (!logs.length) return '<div class="cal-detail-body"><div class="cal-detail-empty">記録なし</div></div>';

  const d = new Date(date+'T00:00:00');
  const allEx = logs.flatMap(l => l.exercises);
  const totalSets = allEx.reduce((s,ex)=>s+ex.sets.length,0);

  return `
    <div class="cal-detail-header">
      <span class="cal-detail-date">${date} (${WD[d.getDay()]})</span>
      <span class="cal-detail-link" onclick="jumpToHistory('${date}')">履歴で見る →</span>
    </div>
    <div class="cal-detail-body">
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:10px;">${allEx.length}種目 / ${totalSets}セット</div>
      ${allEx.map(ex => `
        <div class="history-ex" style="margin-bottom:10px;">
          <div class="history-ex-name">${ex.name}</div>
          <div class="history-sets">
            ${ex.sets.map((s,i)=>`
              <div class="set-chip ${s.memo?'memo-chip':''}">${i+1}: ${s.weight}${s.unit||'kg'}×${s.reps}</div>
            `).join('')}
          </div>
          ${ex.sets.filter(s=>s.memo).map(s=>`
            <div class="history-memo-text">💬 ${s.memo}</div>
          `).join('')}
        </div>
      `).join('')}
      <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border);">
        ${logs.map(l=>`<button class="btn-sm-danger" onclick="delLog('${l.id}')">削除</button>`).join('')}
      </div>
    </div>
  `;
}

window.selectCalDay = function(ds) {
  selectedCalDate = ds;
  renderCalendar();
};

window.moveMonth = function(dir) {
  calMonth += dir;
  if (calMonth>11){ calMonth=0; calYear++; }
  if (calMonth<0){ calMonth=11; calYear--; }
  renderCalendar();
};

// カレンダー→履歴リストへジャンプ
window.jumpToHistory = function(date) {
  setView('list');
  // リスト描画後にスクロール＆ハイライト
  setTimeout(() => {
    const el = document.getElementById(`hday-${date}`);
    if (!el) return;
    // ハイライト
    el.classList.add('highlight');
    setTimeout(() => el.classList.remove('highlight'), 2000);
    // 展開
    const body = document.getElementById(`hb-${date}`);
    const chev = document.getElementById(`chev-${date}`);
    if (body && !body.classList.contains('open')) {
      body.classList.add('open');
      if (chev) chev.classList.add('open');
    }
    // スクロール
    el.scrollIntoView({ behavior:'smooth', block:'start' });
  }, 100);
};

// ===== 履歴リスト =====
function renderHistoryList() {
  const byDate = {};
  historyLogs.forEach(l => {
    if (!byDate[l.date]) byDate[l.date] = [];
    byDate[l.date].push(l);
  });

  const dates = Object.keys(byDate).sort((a,b)=>b.localeCompare(a));
  if (!dates.length) {
    document.getElementById('list-view').innerHTML = '<div class="empty-msg">記録がありません</div>';
    return;
  }

  document.getElementById('list-view').innerHTML = dates.map(date => {
    const logs = byDate[date];
    const allEx = logs.flatMap(l=>l.exercises);
    const totalSets = allEx.reduce((s,ex)=>s+ex.sets.length,0);
    const d = new Date(date+'T00:00:00');
    return `
      <div class="history-day" id="hday-${date}">
        <div class="history-day-header" onclick="toggleHist('${date}')">
          <span class="history-day-date">${date} (${WD[d.getDay()]})</span>
          <span class="history-day-meta">
            <span>${allEx.length}種目</span>
            <span>${totalSets}set</span>
            <span class="chevron" id="chev-${date}">›</span>
          </span>
        </div>
        <div class="history-body" id="hb-${date}">
          ${allEx.map(ex=>`
            <div class="history-ex">
              <div class="history-ex-name">${ex.name}</div>
              <div class="history-sets">
                ${ex.sets.map((s,i)=>`
                  <div class="set-chip ${s.memo?'memo-chip':''}">${i+1}: ${s.weight}${s.unit||'kg'}×${s.reps}</div>
                `).join('')}
              </div>
              ${ex.sets.filter(s=>s.memo).map(s=>`
                <div class="history-memo-text">💬 ${s.memo}</div>
              `).join('')}
            </div>
          `).join('')}
          <div class="history-del-btn">
            ${logs.map(l=>`<button class="btn-sm-danger" onclick="delLog('${l.id}')">削除</button>`).join('')}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

window.toggleHist = function(date) {
  const body = document.getElementById(`hb-${date}`);
  const chev = document.getElementById(`chev-${date}`);
  const isOpen = body.classList.toggle('open');
  if (chev) chev.classList.toggle('open', isOpen);
};

window.delLog = async function(id) {
  if (!confirm('この記録を削除しますか？')) return;
  try {
    await deleteDoc(doc(db, COL, id));
    historyLogs = historyLogs.filter(l => l.id !== id);
    selectedCalDate = null;
    showToast('削除しました','ok');
    if (currentView==='calendar') renderCalendar();
    else renderHistoryList();
  } catch(e) { showToast('削除に失敗しました','ng'); }
};

// ===== 種目管理 =====
window.addCustomExercise = function() {
  const name = document.getElementById('newExName').value.trim();
  const cat = document.getElementById('newExCat').value;
  if (!name) { showToast('種目名を入力してください','ng'); return; }
  const allNames = getAllExNames();
  if (allNames.includes(name)) { showToast('すでに登録済みです','ng'); return; }
  const custom = getCustomEx();
  custom.push({name, category:cat});
  saveCustomEx(custom);
  document.getElementById('newExName').value = '';
  showToast(`「${name}」を追加しました`,'ok');
  renderExerciseList();
};

window.deleteCustomExercise = function(name) {
  if (!confirm(`「${name}」を削除しますか？`)) return;
  saveCustomEx(getCustomEx().filter(e=>e.name!==name));
  showToast('削除しました','ok');
  renderExerciseList();
};

window.renderExerciseList = function() {
  const q = document.getElementById('exSearch').value.trim().toLowerCase();
  const bycat = getAllExByCategory();
  const customNames = new Set(getCustomEx().map(e=>e.name));

  document.getElementById('exerciseManageList').innerHTML = CATEGORIES.map(cat => {
    let items = bycat[cat] || [];
    if (q) items = items.filter(n=>n.toLowerCase().includes(q));
    if (!items.length) return '';
    return `
      <div class="category-section">
        <div class="category-label">${cat}</div>
        ${items.map(name=>`
          <div class="ex-item">
            <span class="ex-item-name">${name}</span>
            ${customNames.has(name)
              ? `<button class="ex-item-del" onclick="deleteCustomExercise('${name}')">削除</button>`
              : `<button class="ex-item-del" disabled>固定</button>`
            }
          </div>
        `).join('')}
      </div>
    `;
  }).join('');
};

// ===== ユーティリティ =====
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 2500);
}

function setSyncStatus(state) {
  document.getElementById('syncDot').className = `sync-dot ${state}`;
}
